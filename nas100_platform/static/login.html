<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Log in — NAS100 ICT Sniper</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header><h1>NAS100 ICT Sniper</h1></header>
<main class="narrow">
  <div class="panel">
    <h2>Log in</h2>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="email" required /></div>
      <div class="field"><label>Password</label><input type="password" id="password" required /></div>
      <button class="primary" type="submit" style="width:100%;">Log in</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="note">No account yet? <a href="/signup.html">Sign up</a></div>
  </div>
</main>
<script src="/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = ''; msg.className = 'msg';
  try {
    await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    location.href = '/';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg err';
  }
});
</script>
</body>
</html>
