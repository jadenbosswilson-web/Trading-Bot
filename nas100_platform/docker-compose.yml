# Local development stack: the app + a real Postgres (so local dev
# matches production instead of silently relying on SQLite).
#
# Usage:
#   cp .env.example .env   # fill in JWT_SECRET / CREDENTIAL_ENCRYPTION_KEY
#   docker compose up --build
#   open http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nas100
      POSTGRES_PASSWORD: nas100
      POSTGRES_DB: nas100
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nas100"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nas100:nas100@db:5432/nas100
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
